# ZarchBlack System Fixes
# ===================================================================

# Fix: intel_oc_wdt INT3F0D:00: probe with driver intel_oc_wdt failed with error -13
# Error -13 = EACCES: the Intel Overclocking Watchdog Timer driver fails to
# probe in the live ISO environment (no hardware access). Blacklisting prevents
# the false error from appearing at boot.
blacklist intel_oc_wdt

# Fix: PCIe Bus Error (BadDLLP) for Realtek RTL8168 network card
# Error: PCIe Bus Error severity=Correctable type=Data Link Layer device [10ec:8168]
options r8169 use_dac=0

# Fix: r8168 DKMS out-of-tree module taint warning
# The r8168-dkms module always taints the kernel. This is expected and harmless.
# Setting this option ensures the module loads but suppresses unnecessary noise.
options r8168 aspm=0

# Fix: intel_pmc_core mapping multiple BARs / resource sanity check
# intel_pmc_core tries to map MMIO regions already reserved by BIOS.
# Disabling the problematic sub-feature prevents the resource conflict.
options intel_pmc_core warn_on_missing_powercap=0
