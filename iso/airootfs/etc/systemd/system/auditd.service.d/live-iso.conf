## ZarchBlack Live ISO - auditd service override
## This drop-in fixes the repeated [FAILED] auditd errors during live boot.
##
## Root cause: auditd starts before the kernel audit backlog is large enough
## to handle the burst of events from module loading (apparmor, r8168, etc.)
## The service restarts 3 times and each time floods the screen with errors.
##
## Fix: Disable restart-on-failure for the live ISO. auditd will still run
## if it starts successfully; if it fails once it simply stops rather than
## spamming the console with three identical FAILED messages.

[Service]
Restart=no
