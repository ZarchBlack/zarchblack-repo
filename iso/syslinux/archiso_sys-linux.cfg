LABEL arch64
TEXT HELP
Boot the Zarch Black install medium on BIOS.
It allows you to install Zarch Black or perform system maintenance.
ENDTEXT
MENU LABEL Zarch Black install medium (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% apparmor=1 security=apparmor audit=0 loglevel=3 iomem=relaxed
# Accessibility boot option
LABEL arch64speech
TEXT HELP
Boot the Zarch Black install medium on BIOS with speakup screen reader.
It allows you to install Zarch Black or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Zarch Black install medium (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on apparmor=1 security=apparmor audit=0 loglevel=3 iomem=relaxed
