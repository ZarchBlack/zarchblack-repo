APPEND archisobasedir=%INSTALL_DIR% archiso_nfs_srv=${pxeserver}:/run/archiso/bootmnt cms_verify=y apparmor=1 security=apparmor audit=1 audit_backlog_limit=8192 intel_pmc_core.warn_on_missing_powercap=0 iomem=relaxed
