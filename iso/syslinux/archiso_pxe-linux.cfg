LABEL arch64_nbd
TEXT HELP
Boot the Zarch Black install medium using NBD.
It allows you to install Zarch Black or perform system maintenance.
ENDTEXT
MENU LABEL Zarch Black install medium (x86_64, NBD)
LINUX ::/%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
INITRD ::/%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y apparmor=1 security=apparmor audit=1 audit_backlog_limit=8192 intel_pmc_core.warn_on_missing_powercap=0 iomem=relaxed
SYSAPPEND 3

LABEL arch64_nfs
TEXT HELP
