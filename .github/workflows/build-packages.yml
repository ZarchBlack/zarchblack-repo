name: Build and Publish ZarchBlack Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update system and install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo gnupg

      - name: Setup builder user
        run: |
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder $GITHUB_WORKSPACE

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          echo "${{ secrets.GPG_PASSPHRASE }}" > /tmp/passphrase
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build and sign packages
        run: |
          su builder -c '
            mkdir -p $GITHUB_WORKSPACE/repo/x86_64
            cd $GITHUB_WORKSPACE/packages
            for pkg_dir in */; do
              if [ -d "$pkg_dir" ]; then
                cd "$pkg_dir"
                makepkg -s --noconfirm
                
                # Sign packages
                for pkg in *.pkg.tar.zst; do
                  if [ -f "$pkg" ]; then
                    gpg --pinentry-mode loopback --passphrase-file /tmp/passphrase --detach-sign "$pkg"
                    cp "$pkg" "$pkg.sig" $GITHUB_WORKSPACE/repo/x86_64/
                  fi
                done
                cd ..
              fi
            done
          '
        env:
          GNUPGHOME: /home/builder/.gnupg

      - name: Create Repo Database
        run: |
          su builder -c '
            cd $GITHUB_WORKSPACE/repo/x86_64
            repo-add -s zarchblack.db.tar.gz *.pkg.tar.zst
          '

      - name: Upload Repo Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    needs: build-and-publish
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
